<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Secret AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --hero-1: #4b55ff; --hero-2: #3b6cf0; --hero-3: #2b8be6;
    --bg: #111114; --bg-2: #1c1c21;
    --card: rgba(44, 44, 52, .62); --card-solid: #26262c;
    --line: rgba(255, 255, 255, .09);
    --text: #f5f5f7; --hint: rgba(235, 235, 245, .58); --hint-2: rgba(235, 235, 245, .32);
    --accent: #4f8cff; --violet: #8b5cf6; --pink: #d946ef; --ok: #34c759; --danger: #ff453a; --warn: #ffd60a;
    --glass: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    --glass-line: rgba(255, 255, 255, .2);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.28);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --safe-top: max(env(safe-area-inset-top), var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  :root[data-theme="light"] {
    --bg: #f2f2f7; --bg-2: #ffffff;
    --card: rgba(255, 255, 255, .72); --card-solid: #ffffff;
    --line: rgba(60, 60, 67, .12);
    --text: #111114; --hint: rgba(60, 60, 67, .62); --hint-2: rgba(60, 60, 67, .3);
    --glass: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.45));
    --glass-line: rgba(255, 255, 255, .8);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 30px rgba(30,30,60,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 17px/1.35 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: -.01em;
         -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: var(--text); }
  img { display: block; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- background ---------- */
  .backdrop { position: fixed; inset: 0 0 auto; height: 780px; z-index: 0; pointer-events: none; transition: opacity .5s var(--ease);
    background:
      radial-gradient(60% 40% at 15% 8%, rgba(139,92,246,.55), transparent 70%),
      radial-gradient(55% 45% at 90% 20%, rgba(43,139,230,.6), transparent 70%),
      linear-gradient(180deg, var(--hero-1) 0%, var(--hero-2) 34%, var(--hero-3) 52%, var(--bg) 82%); }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: radial-gradient(40% 25% at 50% 42%, rgba(255,255,255,.18), transparent 70%);
    animation: drift 12s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(0, 40px, 0) scale(1.15); } }
  body[data-tab="apps"] .backdrop, body[data-tab="settings"] .backdrop { opacity: 0; }

  /* ---------- layout ---------- */
  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 120px); }
  .view { display: none; }
  .view.active { display: block; animation: view-in .55s var(--ease) both; }
  @keyframes view-in { from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(6px); } }
  .stagger > * { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms + 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

  /* ---------- glass ---------- */
  .glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow);
           backdrop-filter: blur(24px) saturate(190%); -webkit-backdrop-filter: blur(24px) saturate(190%); }
  .press { transition: transform .35s var(--spring), background-color .2s, opacity .2s; }
  .press:active { transform: scale(.96); }

  /* ---------- hero ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 6; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; font-weight: 600; color: #fff; white-space: nowrap; }
  .pill .chev { width: 16px; height: 16px; transition: transform .4s var(--spring); }
  .pill[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .pill.cta { background: linear-gradient(135deg, rgba(168,85,247,.9), rgba(124,58,237,.85)); border-color: rgba(233,213,255,.55);
              box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 26px rgba(139,92,246,.45); }
  .topbar .pill.glass:not(.cta) { background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.1)); border-color: rgba(255,255,255,.35);
                                  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(20,20,90,.25); }
  .pill .model-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .hero { text-align: center; padding: 26px 0 28px; color: #fff; }
  .hero .logo { width: 150px; height: 150px; margin: 0 auto; position: relative; filter: drop-shadow(0 14px 30px rgba(20,20,80,.45)); }
  .hero .logo::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.45), transparent 65%);
                        animation: halo 3.6s ease-in-out infinite; z-index: -1; }
  @keyframes halo { 50% { transform: scale(1.25); opacity: .55; } }
  .hero h1 { font-size: 34px; line-height: 1.1; margin: 14px 0 6px; font-weight: 800; letter-spacing: -.025em; }
  .hero p { margin: 0 auto; max-width: 330px; color: rgba(255,255,255,.78); font-size: 16px; }

  /* ---------- model menu ---------- */
  .menu { position: absolute; top: 52px; left: 0; width: min(330px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; border-radius: 28px; padding: 8px;
          transform-origin: 30px 0; transform: scale(.6) translateY(-10px); opacity: 0; pointer-events: none; filter: blur(8px);
          transition: transform .5s var(--spring), opacity .25s, filter .3s; background: rgba(38,38,50,.96); }
  :root[data-theme="light"] .menu { background: rgba(255,255,255,.92); }
  .menu.open { transform: none; opacity: 1; pointer-events: auto; filter: none; }
  .menu button { display: flex; width: 100%; text-align: left; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; }
  .menu button:active, .menu button.on { background: rgba(255,255,255,.1); }
  .menu .t { font-weight: 600; font-size: 17px; }
  .menu .d { color: var(--hint); font-size: 14px; }
  .menu .check { margin-left: auto; color: var(--accent); opacity: 0; }
  .menu button.on .check { opacity: 1; }

  /* ---------- sections and lists ---------- */
  .section { margin-top: 30px; }
  .section > h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 4px 2px; }
  .section > .sub { color: var(--hint); margin: 0 4px 14px; font-size: 16px; }
  .section > h2 + .list { margin-top: 12px; }
  .list { background: var(--card); border-radius: 28px; overflow: hidden; border: 1px solid var(--line);
          backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); }
  .row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 16px; position: relative; min-height: 64px;
         transition: background-color .25s; }
  .row:active { background: rgba(255,255,255,.06); }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 72px; right: 16px; height: 1px; background: var(--line); }
  .row.compact + .row.compact::before { left: 56px; }
  .row .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; font-size: 30px; line-height: 1; overflow: hidden; }
  .row .ic.tile { background: rgba(255,255,255,.94); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .row .ic.tile img { width: 30px; height: 30px; object-fit: contain; }
  .row .ic.letter { background: linear-gradient(135deg, var(--violet), var(--accent)); color: #fff; font-size: 20px; font-weight: 700; }
  .row .ic.sym { width: 32px; height: 32px; font-size: 22px; color: var(--text); }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 17px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .d { color: var(--hint); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .d.ok { color: var(--ok); }
  .row .val { color: var(--hint); font-size: 16px; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { color: var(--hint-2); width: 18px; height: 18px; }
  .row.more { color: var(--accent); font-weight: 500; min-height: 56px; }
  .row.more .ic { width: 32px; height: 32px; color: var(--accent); }
  .row.danger { color: var(--danger); }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; letter-spacing: .02em; text-transform: uppercase; }
  .badge.new { background: var(--accent); color: #fff; }
  .badge.on { background: rgba(52,199,89,.18); color: var(--ok); }
  .badge.app { background: rgba(79,140,255,.16); color: var(--accent); text-transform: none; font-weight: 600; letter-spacing: 0; }
  .plus { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text);
          transition: transform .45s var(--spring), background-color .3s, color .3s; }
  .plus svg { width: 26px; height: 26px; stroke-width: 1.8; }
  .plus.on { background: rgba(52,199,89,.16); color: var(--ok); transform: rotate(360deg); }
  .plus.busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .save { color: var(--ok); font-size: 14px; font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 4px; }

  /* ---------- quick cards ---------- */
  .quick .row { min-height: 74px; }
  .spark { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 3px 8px var(--glow)); animation: twinkle 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes twinkle { 50% { transform: scale(.86) rotate(12deg); } }

  /* ---------- apps tab ---------- */
  .page-title { font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin: 8px 4px 2px; }
  .page-sub { color: var(--hint); margin: 0 4px 16px; }
  .search { position: sticky; top: calc(var(--safe-top) + 8px); z-index: 5; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;
            border-radius: 24px; margin-bottom: 16px; }
  .search input { flex: 1; background: none; border: 0; outline: none; height: 100%; font-size: 17px; }
  .search input::placeholder { color: var(--hint); }
  .search .i { color: var(--hint); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { height: 36px; padding: 0 14px; border-radius: 18px; white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--text); }
  .chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .skeleton .ic, .skeleton .bar { background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 75%);
            background-size: 200% 100%; animation: shimmer 1.3s infinite; }
  :root[data-theme="light"] .skeleton .ic, :root[data-theme="light"] .skeleton .bar {
            background-image: linear-gradient(90deg, rgba(0,0,0,.05) 25%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.05) 75%); }
  .skeleton .bar { height: 12px; border-radius: 6px; margin: 6px 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { text-align: center; color: var(--hint); padding: 40px 20px; }
  .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 22px; margin-bottom: 16px; font-size: 15px; color: var(--hint); }
  .notice b { color: var(--text); }

  /* ---------- tab bar ---------- */
  .tabbar { position: fixed; z-index: 20; left: 50%; bottom: calc(var(--safe-bottom) + 14px); transform: translateX(-50%);
            width: min(528px, calc(100vw - 28px)); height: 70px; border-radius: 35px; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr);
            background: rgba(30,30,38,.8); backdrop-filter: blur(28px) saturate(190%); -webkit-backdrop-filter: blur(28px) saturate(190%); }
  :root[data-theme="light"] .tabbar { background: rgba(255,255,255,.82); }
  body::after { content: ""; position: fixed; z-index: 19; left: 0; right: 0; bottom: 0; height: calc(var(--safe-bottom) + 110px); pointer-events: none;
                background: linear-gradient(to bottom, transparent, var(--bg) 78%); }
  .tabbar .lens { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 30px;
                  background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.06);
                  transform: translateX(calc(var(--tab, 0) * 100%)); transition: transform .6s var(--spring); }
  :root[data-theme="light"] .tabbar .lens { background: rgba(0,0,0,.06); }
  .tabbar .lens.squish { animation: squish .6s var(--spring); }
  @keyframes squish { 30% { scale: 1.12 .9; } }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px;
         font-weight: 600; color: var(--text); transition: color .3s; }
  .tab svg { width: 28px; height: 28px; transition: transform .5s var(--spring); }
  .tab.on { color: var(--accent); }
  .tab.on svg { transform: scale(1.1); }
  .tab .ghost-ic { width: 30px; height: 30px; }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto;
           border-radius: 34px 34px 0 0; padding: 14px 20px calc(var(--safe-bottom) + 24px);
           background: rgba(34,34,42,.82); transform: translateY(105%); transition: transform .55s var(--spring); }
  :root[data-theme="light"] .sheet { background: rgba(248,248,252,.88); }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--hint-2); margin: 0 auto 10px; }
  .sheet .close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .sheet .close svg { width: 18px; height: 18px; }
  .sheet .head { text-align: center; padding: 14px 8px 4px; }
  .sheet .big { width: 92px; height: 92px; border-radius: 26px; margin: 4px auto 14px; display: grid; place-items: center; background: #fff;
                box-shadow: 0 12px 34px rgba(0,0,0,.3); animation: pop .7s var(--spring) both; position: relative; }
  .sheet .big img { width: 60px; height: 60px; object-fit: contain; }
  .sheet .big.letter { background: linear-gradient(135deg, var(--violet), var(--accent)); color: #fff; font-size: 40px; font-weight: 800; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .sheet h3 { font-size: 26px; margin: 0 0 6px; font-weight: 800; letter-spacing: -.02em; }
  .sheet .lead { color: var(--hint); margin: 0 0 20px; font-size: 16px; }
  .sheet .list { margin-bottom: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 28px; font-weight: 700; font-size: 17px;
         color: #fff; background: linear-gradient(135deg, #5b6cff, #8b5cf6); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(91,108,255,.4);
         transition: transform .35s var(--spring), filter .2s, background .4s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { filter: saturate(.4) brightness(.8); }
  .btn.ok { background: linear-gradient(135deg, #30d158, #22a447); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(48,209,88,.35); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--danger); height: 48px; margin-top: 6px; }
  .btn.secondary { background: rgba(255,255,255,.1); box-shadow: none; color: var(--text); margin-top: 10px; }
  .btn .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }
  .field { width: 100%; height: 52px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.06); outline: none;
           margin-bottom: 10px; transition: border-color .2s, box-shadow .2s; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,140,255,.18); }
  .small { color: var(--hint); font-size: 14px; margin: 6px 4px 14px; }
  .small a { color: var(--accent); text-decoration: none; }
  .waiting { position: absolute; inset: -10px; border-radius: 34px; border: 2px solid var(--accent); opacity: 0; }
  .big.wait .waiting { animation: ring 1.6s ease-out infinite; }
  .big.wait .waiting + .waiting { animation-delay: .8s; }
  @keyframes ring { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
  .done-check { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; background: var(--ok); display: grid; place-items: center;
                box-shadow: 0 0 0 4px var(--bg-2); animation: pop .6s var(--spring) both; }
  .done-check svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .2s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- toast ---------- */
  .toast { position: fixed; z-index: 50; left: 50%; top: calc(var(--safe-top) + 12px); transform: translate(-50%, -140%); max-width: calc(100vw - 32px);
           padding: 12px 18px; border-radius: 22px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center;
           background: rgba(40,40,50,.7); color: #fff; transition: transform .55s var(--spring); }
  :root[data-theme="light"] .toast { background: rgba(255,255,255,.8); color: var(--text); }
  .toast.show { transform: translate(-50%, 0); }

  .footer { text-align: center; color: var(--hint-2); font-size: 13px; margin-top: 28px; }
  .footer .mini { width: 44px; height: 44px; margin: 0 auto 6px; opacity: .8; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-tab="agent">
<div class="backdrop"></div>

<main>
  <!-- ============ AGENT ============ -->
  <section class="view active" id="view-agent">
    <div class="topbar">
      <button class="pill glass press" id="model-btn" aria-expanded="false" aria-haspopup="true">
        <span class="model-name" id="model-name">…</span>
        <svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="pill glass press cta" id="cta-apps">
        <svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="none"/></svg>
        <span id="cta-text"></span>
      </button>
      <div class="menu glass" id="model-menu" role="menu"></div>
    </div>
    <div class="hero">
      <div class="logo" id="hero-logo"></div>
      <h1 id="hello"></h1>
      <p data-t="heroSub"></p>
    </div>
    <div class="list quick stagger" id="quick"></div>

    <div class="section">
      <h2 data-t="connections"></h2>
      <p class="sub" data-t="connectionsSub"></p>
      <div class="list stagger" id="home-apps"></div>
    </div>
  </section>

  <!-- ============ DISCOVER ============ -->
  <section class="view" id="view-discover">
    <div id="discover" class="stagger"></div>
  </section>

  <!-- ============ APPS ============ -->
  <section class="view" id="view-apps">
    <h1 class="page-title" data-t="apps"></h1>
    <p class="page-sub" id="apps-sub"></p>
    <label class="search glass">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="chips" id="chips"></div>
    <div id="apps-notice"></div>
    <div class="section" id="my-apps-wrap" style="margin-top:0">
      <div class="list" id="my-apps"></div>
    </div>
    <div class="list" id="catalog" style="margin-top:16px"></div>
    <div id="catalog-end" style="height:1px"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="view" id="view-settings">
    <h1 class="page-title" data-t="settings"></h1>
    <div id="settings" class="stagger"></div>
    <div class="footer"><div class="mini" id="footer-logo"></div>Secret AI · Mini App</div>
  </section>
</main>

<nav class="tabbar glass" id="tabbar">

  renderHomeApps();
  renderMyApps();
  renderSettings();
  if (!catalog.loaded) loadCatalog(true); else renderCatalog();
}

/* ---------------- header and model menu ---------------- */
function prettyModel(id) {
  return String(id).replace(/^gpt-/i, "GPT-").replace(/^claude-/i, "Claude ").replace(/-(\w)/g, (_, c) => " " + c.toUpperCase()).replace(/ (\d)/g, " $1");
}
function renderHeader() {
  const s = state.settings;
  $("model-name").textContent = prettyModel(s.model);
  $("hello").textContent = T.hello(state.user.first_name);
  const n = connectedCount();
  $("cta-text").textContent = n ? T.ctaSome(n) : T.ctaNone;
  $("model-menu").innerHTML = s.models.map(m => `
    <button role="menuitemradio" data-model="${esc(m)}" class="${m === s.model ? "on" : ""}">
      <div><div class="t">${esc(prettyModel(m))}</div><div class="d">${esc(m)}</div></div>
      <span class="check">${ICON.check}</span></button>`).join("");
}
function toggleMenu(open) {
  const menu = $("model-menu"), btn = $("model-btn");
  open = open ?? !menu.classList.contains("open");
  menu.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open);
  haptic("light");
}
$("model-btn").addEventListener("click", e => { e.stopPropagation(); toggleMenu(); });
document.addEventListener("click", e => {
  if ($("model-menu").classList.contains("open") && !e.target.closest("#model-menu")) toggleMenu(false);
});
$("model-menu").addEventListener("click", async e => {
  const b = e.target.closest("[data-model]");
  if (!b) return;
  if (state.settings.models.length < 2) { $("model-menu").classList.remove("open"); return; }
  haptic("select");
  try { state.settings = (await api("/api/settings", { model: b.dataset.model })).settings; renderHeader(); renderSettings(); toast(T.saved); }
  catch (err) { toast(errorText(err)); }
  $("model-menu").classList.remove("open"); $("model-btn").setAttribute("aria-expanded", false);
});
$("cta-apps").addEventListener("click", () => switchTab("apps"));

/* ---------------- quick + discover ---------------- */
function renderQuick() {
  $("quick").innerHTML = QUICK.map((q, i) => `
    <button class="row press" style="--i:${i}" data-q="${i}">
      ${q.spark}
      <div class="body"><div class="t">${esc(q.t)}</div><div class="save">${ICON.bolt} ${T.saves} ${esc(q.save)}</div></div>
      ${ICON.chev}</button>`).join("");
}
function renderDiscover() {
  $("discover").innerHTML = DISCOVER.map(([title, rows], s) => `
    <div class="section" style="--i:${s}${s === 0 ? ";margin-top:8px" : ""}"><h2>${esc(title)}</h2><div class="list">
      ${rows.map(([emoji, t, d, text, app, draft, appName], i) => `
        <button class="row press" data-s="${s}" data-r="${i}">
          <div class="ic">${emoji}</div>
          <div class="body"><div class="t">${esc(t)}</div><div class="d">${app ? `<span class="badge app">${esc(appName)}</span> ` : ""}${esc(d)}</div></div>
          ${ICON.chev}</button>`).join("")}

function runScenario({ text, app, appName }) {
  haptic("medium");
  if (app && !connectedSlugs().has(app)) {
    openAppSheet({ slug: app, name: appName, img: catalog.find(app)?.img || "" }, { needs: true, then: text });
    return;
  }
  sendToChat(text);
}
async function sendToChat(text) {
  try {
    await api("/api/ask", { text });
    haptic("success");
    toast(T.sent);
    setTimeout(() => tg?.close?.(), 700);
  } catch (e) { toast(errorText(e)); haptic("error"); }
}
$("quick").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) runScenario(QUICK[+b.dataset.q]); });
$("discover").addEventListener("click", e => {
  const b = e.target.closest("[data-s]");
  if (!b) return;
  const [, , , text, app, , appName] = DISCOVER[+b.dataset.s][1][+b.dataset.r];
  runScenario({ text, app, appName });
});

/* ---------------- app rows ---------------- */
function appRow(app, i = 0) {
  const on = app.slug === "github" ? state?.github?.connected : connectedSlugs().has(app.slug);
  return `<button class="row press" style="--i:${i}" data-app="${esc(app.slug)}">
    ${appIcon(app)}
    <div class="body"><div class="t">${esc(app.name)}</div><div class="d">${esc(app.description || "")}</div></div>
    <span class="plus ${on ? "on" : ""}" data-plus="${esc(app.slug)}">${on ? ICON.check : ICON.plus}</span></button>`;
}
function renderHomeApps() {
  const mine = (state.apps.connected || []).map(a => ({ slug: a.slug, name: a.name, img: a.img, description: a.account || T.connected }));
  if (state.github.connected) mine.unshift({ slug: "github", name: "GitHub", img: GH_LOGO, description: "@" + state.github.login });
  const seen = new Set(mine.map(a => a.slug));
  const pool = catalog.featured.length ? catalog.featured : [];
  const picks = FEATURED_HOME.map(s => pool.find(a => a.slug === s)).filter(a => a && !seen.has(a.slug)).slice(0, Math.max(2, 5 - mine.length));
  $("home-apps").innerHTML = [...mine, ...picks].map(appRow).join("") +
    `<button class="row more press" id="more-apps"><span class="ic">${ICON.search}</span><span class="body">${T.more}</span></button>`;
  $("more-apps").onclick = () => switchTab("apps");
}
function renderMyApps() {
  const mine = (state.apps.connected || []);
  const rows = [];
  if (state.github.connected) rows.push({ slug: "github", name: "GitHub", img: GH_LOGO, description: "@" + state.github.login });
  mine.forEach(a => rows.push({ slug: a.slug, name: a.name, img: a.img, description: (a.account || T.connected) + (a.healthy ? "" : " · ⚠️") }));
  $("my-apps-wrap").style.display = rows.length ? "" : "none";
  $("my-apps").innerHTML = rows.map(appRow).join("");
  if (!state.apps.enabled) {
    $("apps-notice").innerHTML = `<div class="notice glass"><span style="font-size:22px">🔌</span><div><b>${T.notReady}</b><br>${T.notReadySub}</div></div>`;
  } else $("apps-notice").innerHTML = "";
}
document.addEventListener("click", e => {
  const row = e.target.closest("[data-app]");
  if (!row) return;
  const slug = row.dataset.app;
  const app = catalog.find(slug) || findConnected(slug) || { slug, name: slug };
  openAppSheet(app);
});
function findConnected(slug) {
  if (slug === "github") return { slug, name: "GitHub", img: GH_LOGO };
  const a = (state?.apps?.connected || []).find(x => x.slug === slug);
  return a && { slug, name: a.name, img: a.img, description: a.account };
}

/* ---------------- catalog ---------------- */
const catalog = {
  items: [], featured: [], next: null, total: null, q: "", loading: false, loaded: false, seq: 0,
  find(slug) { return this.items.find(a => a.slug === slug) || this.featured.find(a => a.slug === slug); },
};
async function loadCatalog(reset) {
  if (catalog.loading && !reset) return;
  const seq = ++catalog.seq;
  catalog.loading = true;
  if (reset) { catalog.items = []; catalog.next = null; renderCatalog(true); }
  try {
    const data = await api("/api/catalog", { q: catalog.q, after: reset ? "" : catalog.next || "" });
    if (seq !== catalog.seq) return;
    catalog.items = reset ? data.apps : catalog.items.concat(data.apps);
    catalog.next = data.next;
    if (data.total) catalog.total = data.total;
    if (!catalog.q && reset) { catalog.featured = data.apps; if (state) renderHomeApps(); }
    catalog.loaded = true;
  } catch (e) { if (seq === catalog.seq) toast(errorText(e)); }
  finally { if (seq === catalog.seq) { catalog.loading = false; renderCatalog(); } }
}
function renderCatalog(skeleton = false) {
  $("apps-sub").textContent = T.appsSub(catalog.total);
  const el = $("catalog");
  if (skeleton) {
    el.innerHTML = Array.from({ length: 6 }, () => `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:40%"></div><div class="bar" style="width:75%"></div></div></div>`).join("");
    el.classList.remove("stagger");
    return;
  }
  const mine = connectedSlugs();
  const items = catalog.items.filter(a => !mine.has(a.slug));
  el.classList.add("stagger");
  el.innerHTML = items.length ? items.map((a, i) => appRow(a, i % 40)).join("") : `<div class="empty">${T.none}</div>`;
  if (catalog.next) el.insertAdjacentHTML("beforeend", `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:50%"></div></div></div>`);
}
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && catalog.next && !catalog.loading && document.body.dataset.tab === "apps") loadCatalog(false);
}, { rootMargin: "400px" }).observe($("catalog-end"));
let searchTimer;
$("search").placeholder = T.search;
$("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { catalog.q = e.target.value.trim(); setChip(catalog.q ? null : "all"); loadCatalog(true); }, 280);
});
function setChip(key) { document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.chip === key)); }
$("chips").innerHTML = Object.entries(T.chips).map(([k, v]) => `<button class="chip glass press ${k === "all" ? "on" : ""}" data-chip="${k}">${esc(v)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const c = e.target.closest("[data-chip]");
  if (!c) return;
  haptic("select");
  setChip(c.dataset.chip);
  catalog.q = CHIP_QUERY[c.dataset.chip];
  $("search").value = "";
  loadCatalog(true);
});

/* ---------------- sheets ---------------- */
let sheetClose = null;
function openSheet(html, onClose) {
  const sheet = $("sheet");
  sheet.innerHTML = `<div class="grab"></div><button class="close glass press" aria-label="close">${ICON.close}</button>` + html;
  sheet.querySelector(".close").onclick = closeSheet;
  sheet.querySelectorAll("[data-link]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openLink(a.dataset.link); }));
  requestAnimationFrame(() => { sheet.classList.add("open"); $("scrim").classList.add("open"); });
  sheetClose = onClose || null;
  tg?.BackButton?.show();
  haptic("medium");
}
function closeSheet() {
  $("sheet").classList.remove("open");
  $("scrim").classList.remove("open");
  tg?.BackButton?.hide();
  stopWaiting();
  const fn = sheetClose; sheetClose = null; fn?.();
}
$("scrim").onclick = closeSheet;
tg?.BackButton?.onClick(closeSheet);
// Swipe the sheet down to close.
(() => {
  let y0 = null, dy = 0;
  const s = $("sheet");
  s.addEventListener("touchstart", e => { if (s.scrollTop <= 0) { y0 = e.touches[0].clientY; s.style.transition = "none"; } }, { passive: true });
  s.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); s.style.transform = `translateY(${dy}px)`; }, { passive: true });
  s.addEventListener("touchend", () => { if (y0 === null) return; s.style.transition = ""; s.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; dy = 0; });
})();

let waitTimer = null;
function stopWaiting() { clearInterval(waitTimer); waitTimer = null; }

function openAppSheet(app, opts = {}) {
  if (app.slug === "github") return openGitHubSheet();
  const account = (state?.apps?.connected || []).find(a => a.slug === app.slug);
  const icon = app.img ? `<div class="big" id="big"><img src="${esc(app.img)}" alt=""><span class="waiting"></span><span class="waiting"></span></div>`
                       : `<div class="big letter" id="big">${esc((app.name || "?")[0])}<span class="waiting"></span><span class="waiting"></span></div>`;
  const lead = opts.needs ? T.needsAppSub : esc(app.description || "");
  if (account) {
    openSheet(`<div class="head">${icon}<h3>${esc(app.name)}</h3><p class="lead"><span class="badge on">${T.connected}</span> ${esc(account.account || "")}</p></div>
      <button class="btn" id="try">${T.tryAsk}</button>
      <button class="btn ghost" id="off">${T.disconnect}</button>`);
    $("big").insertAdjacentHTML("beforeend", `<span class="done-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`);
    $("try").onclick = () => { closeSheet(); sendToChat(lang === "ru" ? `Что ты можешь сделать с моим ${app.name}? Предложи 3 полезных действия.` : `What can you do with my ${app.name}? Suggest 3 useful actions.`); };
    $("off").onclick = () => confirm(T.disconnectAsk(app.name), async () => {
      try { state = await api("/api/apps/disconnect", { id: account.id }); renderAll(); closeSheet(); toast(T.removed); haptic("warning"); }
      catch (e) { toast(errorText(e)); }
    });
    return;
  }
  openSheet(`<div class="head">${icon}<h3>${opts.needs ? esc(T.needsApp(app.name)) : esc(app.name)}</h3><p class="lead" id="lead">${lead}</p></div>
    <button class="btn" id="go">${esc(T.connectApp(app.name))}</button>`);
  $("go").onclick = () => startConnect(app, opts);
}

async function startConnect(app, opts) {
  const btn = $("go");
  if (!state.apps.enabled) { toast(T.notReady); haptic("warning"); return; }
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${T.opening}`;
  try {
    const { url } = await api("/api/apps/connect", { slug: app.slug });
    openLink(url);
    $("big")?.classList.add("wait");
    $("lead").textContent = T.waitingSub;
    btn.innerHTML = `<span class="spinner"></span>${T.waiting}`;
    const before = new Set((state.apps.connected || []).map(a => a.id));
    const started = Date.now();
    stopWaiting();
    waitTimer = setInterval(async () => {
      if (Date.now() - started > 5 * 60 * 1000) { stopWaiting(); btn.disabled = false; btn.textContent = T.connectApp(app.name); return; }
      if (document.hidden) return;
      const s = await load(true);
      const fresh = (s?.apps?.connected || []).find(a => a.slug === app.slug && !before.has(a.id));
      if (fresh) { stopWaiting(); connectedAnimation(app, opts); }
    }, 2500);
  } catch (e) {
    btn.disabled = false; btn.textContent = T.connectApp(app.name);
    toast(errorText(e)); haptic("error");
  }
}
function connectedAnimation(app, opts) {
  haptic("success");
  const big = $("big");
  if (!big) return;
  big.classList.remove("wait");
  big.insertAdjacentHTML("beforeend", `<span class="done-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`);
  document.querySelector("#sheet h3").textContent = T.connectedTo(app.name);
  $("lead").textContent = T.connectedSub;
  const btn = $("go");
  btn.disabled = false;
  btn.classList.add("ok");
  btn.innerHTML = opts.then ? `${T.runIt} ✨` : `${ICON.check} ${T.connected}`;
  btn.onclick = () => { closeSheet(); if (opts.then) sendToChat(opts.then); };
  if (!opts.then) setTimeout(() => { if ($("go") === btn) closeSheet(); }, 1800);
}

function confirm(text, ok) {
  if (tg?.showConfirm && tg.isVersionAtLeast?.("6.2")) tg.showConfirm(text, yes => yes && ok());
  else if (window.confirm(text)) ok();
}

function openGitHubSheet() {
  const gh = state.github;
  const icon = `<div class="big" id="big"><img src="${GH_LOGO}" alt=""><span class="waiting"></span><span class="waiting"></span></div>`;
  if (gh.connected) {
    openSheet(`<div class="head">${icon}<h3>GitHub</h3><p class="lead">${esc(T.ghConnected(gh.login))}</p></div>
      <button class="btn" id="try">${T.tryAsk}</button><button class="btn ghost" id="off">${T.disconnect}</button>`);
    $("big").insertAdjacentHTML("beforeend", `<span class="done-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`);
    $("try").onclick = () => { closeSheet(); sendToChat(lang === "ru" ? "Покажи мои репозитории на GitHub." : "Show my GitHub repositories."); };
    $("off").onclick = () => confirm(T.disconnectAsk("GitHub"), async () => {
      try { state = await api("/api/disconnect", { service: "github", label: "github" }); renderAll(); closeSheet(); toast(T.removed); } catch (e) { toast(errorText(e)); }
    });
    return;
  }
  openSheet(`<div class="head">${icon}<h3>GitHub</h3><p class="lead" id="lead">${T.ghSub}</p></div>
    ${gh.oauth ? `<button class="btn" id="go">${T.ghOauth}</button><div style="height:18px"></div>` : ""}
    <input class="field" id="gh-token" type="password" autocomplete="off" placeholder="${T.ghToken}">
    <div class="small">${T.ghTokenHint}</div>
    <button class="btn ${gh.oauth ? "secondary" : ""}" id="gh-save">${T.save}</button>`);
  if (gh.oauth) $("go").onclick = async () => {
    try {
      const { url } = await api("/api/github/oauth");
      openLink(url);
      $("big").classList.add("wait");
      $("go").innerHTML = `<span class="spinner"></span>${T.waiting}`;
      const started = Date.now();
      stopWaiting();
      waitTimer = setInterval(async () => {
        if (document.hidden) return;
        const s = await load();
        if (s?.github?.connected) { stopWaiting(); connectedAnimation({ name: "GitHub" }, {}); }
        else if (Date.now() - started > 5 * 60 * 1000) stopWaiting();
      }, 2500);
    } catch (e) { toast(errorText(e)); }
  };
  $("gh-save").onclick = async e => {
    e.target.disabled = true;
    try { state = await api("/api/github/token", { token: $("gh-token").value }); renderAll(); closeSheet(); toast(T.saved); haptic("success"); }
    catch (err) { toast(errorText(err)); haptic("error"); }
    finally { e.target.disabled = false; }
  };
}

/* ---------------- settings ---------------- */

  const persona = s.personas.find(p => p.id === s.persona) || s.personas[0];
  const group = (title, rows, i) => `<div class="section" style="--i:${i};margin-top:${i ? 26 : 8}px"><p class="sub" style="font-weight:600;margin-bottom:8px">${title}</p><div class="list">${rows.join("")}</div></div>`;

  $("settings").innerHTML = [
    group(T.secretAi, [row("set-mode", SYM.mode, T.mode, `${persona.emoji} ${esc(persona[lang])}`), row("set-model", SYM.model, T.model, esc(prettyModel(s.model)))], 0),

      row("set-mcp", SYM.mcp, T.mcp, state.mcp.length ? String(state.mcp.length) : ""),
    ], 1),
    group(T.profile, [row("set-id", SYM.user, T.tgId, String(state.user.id)), row("set-mem", SYM.memory, T.memory, T.msgs(s.messages))], 2),
    `<div class="section" style="--i:3;margin-top:26px"><div class="list">${row("set-clear", SYM.trash, T.clear, "", "danger")}</div></div>`,
  ].join("");

  $("set-model").onclick = () => { switchTab("agent"); setTimeout(() => toggleMenu(true), 350); };
  $("set-gh").onclick = openGitHubSheet;
  $("set-apps").onclick = () => switchTab("apps");
  $("set-mcp").onclick = openMcpSheet;
  $("set-id").onclick = () => { navigator.clipboard?.writeText(String(state.user.id)); toast(T.copied); haptic("light"); };
  $("set-mem").onclick = () => confirm(T.clearAsk, clearMemory);
  $("set-clear").onclick = () => confirm(T.clearAsk, clearMemory);
}
async function clearMemory() {
  try { state.settings = (await api("/api/reset")).settings; renderSettings(); toast(T.cleared); haptic("success"); }
  catch (e) { toast(errorText(e)); }
}

/* ---------------- tabs ---------------- */
const TABS = ["agent", "discover", "apps", "settings"];
function switchTab(tab) {
  if (document.body.dataset.tab === tab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  haptic("select");
  document.body.dataset.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const lens = $("lens");
  lens.style.setProperty("--tab", TABS.indexOf(tab));
  lens.classList.remove("squish"); void lens.offsetWidth; lens.classList.add("squish");
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  $("model-menu").classList.remove("open");
  window.scrollTo(0, 0);
  paintHeader();
  if (tab === "apps" && !catalog.loaded) loadCatalog(true);
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

/* ---------------- Telegram chrome ---------------- */
function paintHeader() {
  if (!tg?.setHeaderColor || !tg.isVersionAtLeast?.("6.1")) return;
  const hero = ["agent", "discover"].includes(document.body.dataset.tab) && window.scrollY < 60;
  const color = hero ? "#4b55ff" : getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  if (paintHeader.last !== color) { paintHeader.last = color; try { tg.setHeaderColor(color); } catch (e) {} }
}
window.addEventListener("scroll", paintHeader, { passive: true });

function init() {
  const dark = (tg?.colorScheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) !== "light";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("hero-logo").innerHTML = logoSvg("hero");
  $("footer-logo").innerHTML = logoSvg("foot");
  $("hello").textContent = T.hello(tg?.initDataUnsafe?.user?.first_name);
  renderQuick();
  renderDiscover();
  renderCatalog(true);
  $("home-apps").innerHTML = Array.from({ length: 4 }, () => `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:35%"></div><div class="bar" style="width:70%"></div></div></div>`).join("");
  $("model-name").textContent = "…";
  $("cta-text").textContent = T.ctaNone;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.isVersionAtLeast?.("7.7") && tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.isVersionAtLeast?.("6.1") && tg.setBackgroundColor(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); } catch (e) {}
    try { tg.isVersionAtLeast?.("7.10") && tg.setBottomBarColor?.(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); } catch (e) {}
    tg.onEvent?.("themeChanged", () => location.reload());
  }
  paintHeader();
  load();
  // Re-check connections after returning from a sign-in page.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state) load(true); });
}
init();
</script>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Secret AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #060609; --bg-2: #0e0e14;
    --card: rgba(19, 19, 27, .72); --card-solid: #13131b;
    --line: rgba(255, 255, 255, .065);
    --text: #f2f2f7; --hint: rgba(235, 235, 245, .52); --hint-2: rgba(235, 235, 245, .26);
    --accent: #8f80ff; --violet: #8b5cf6; --pink: #d946ef; --ok: #34c759; --danger: #ff453a; --warn: #ffd60a;
    --glass: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    --glass-line: rgba(255, 255, 255, .09);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 12px 32px rgba(0,0,0,.45);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --safe-top: max(env(safe-area-inset-top), var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  }
  :root[data-theme="light"] {
    --bg: #f2f2f7; --bg-2: #ffffff;
    --card: rgba(255, 255, 255, .72); --card-solid: #ffffff;
    --line: rgba(60, 60, 67, .12);
    --text: #111114; --hint: rgba(60, 60, 67, .62); --hint-2: rgba(60, 60, 67, .3);
    --glass: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.45));
    --glass-line: rgba(255, 255, 255, .8);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 30px rgba(30,30,60,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none; }
  body { font: 15.5px/1.35 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; letter-spacing: -.01em;
         -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: var(--text); }
  img { display: block; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- background ---------- */
  /* Splash while the app loads: an aurora fading into black and the grey mascot, like Telegram's loading screen. */
  #splash { position: fixed; inset: 0; z-index: 1000; background: #000; display: grid; place-items: center;
    transition: opacity .45s var(--ease), visibility 0s linear .45s; }
  #splash::before { content: ""; position: absolute; inset: -20% -30% 25%; filter: blur(40px);
    background: radial-gradient(60% 45% at 50% 15%, #5a4fd6 0, rgba(90,79,214,0) 70%),
                radial-gradient(45% 40% at 15% 45%, #3b1fa8 0, rgba(59,31,168,0) 70%),
                radial-gradient(45% 40% at 85% 40%, #7a2bd9 0, rgba(122,43,217,0) 70%),
                linear-gradient(180deg, #2a2370 0%, #17124a 35%, #07061a 65%, #000 100%);
    animation: splash-aurora 6s ease-in-out infinite alternate; }
  #splash svg { position: relative; width: 120px; height: 120px; margin-top: -4vh; color: #8e8e93;
    animation: splash-breathe 2.2s ease-in-out infinite; }
  #splash.gone { opacity: 0; visibility: hidden; }
  @keyframes splash-aurora { from { transform: translateY(-2%) scale(1); } to { transform: translateY(3%) scale(1.06); } }
  @keyframes splash-breathe { 0%, 100% { transform: scale(1) rotate(0); opacity: .85; } 50% { transform: scale(1.06) rotate(4deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #splash::before, #splash svg { animation: none; } }
  .backdrop { position: fixed; inset: 0 0 auto; height: 620px; z-index: 0; pointer-events: none; transition: opacity .5s var(--ease);
    background:
      radial-gradient(55% 38% at 50% 0%, rgba(109,93,252,.32), transparent 70%),
      radial-gradient(40% 30% at 12% 10%, rgba(76,52,190,.28), transparent 70%),
      radial-gradient(40% 32% at 92% 16%, rgba(40,110,200,.2), transparent 70%); }
  .backdrop::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background: radial-gradient(30% 18% at 50% 30%, rgba(160,150,255,.16), transparent 70%); }
  body[data-tab="apps"] .backdrop, body[data-tab="settings"] .backdrop, body[data-tab="gen"] .backdrop { opacity: .45; }

  /* ---------- layout ---------- */
  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 120px); }
  .view { display: none; }
  .view.active { display: block; animation: view-in .45s var(--ease) both; }
  @keyframes view-in { from { opacity: 0; transform: translate3d(0, 10px, 0); } }
  .stagger > * { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms + 40ms); }
  .stagger.settled > * { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }

  /* ---------- glass ---------- */
  .glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow);
           backdrop-filter: blur(24px) saturate(190%); -webkit-backdrop-filter: blur(24px) saturate(190%); }
  .press { transition: transform .35s var(--spring), background-color .2s, opacity .2s; }
  .press:active { transform: scale(.96); }

  /* ---------- hero ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 6; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 19px; font-weight: 600; font-size: 15px; color: #fff; white-space: nowrap; }
  .pill .chev { width: 16px; height: 16px; transition: transform .4s var(--spring); }
  .pill[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .pill { color: var(--text); }
  .pill.cta { background: linear-gradient(180deg, rgba(143,128,255,.22), rgba(143,128,255,.1)); border-color: rgba(143,128,255,.35);
              box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 24px rgba(0,0,0,.35); }
  .pill.cta svg { color: #b4a9ff; }
  .pill .model-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .hero { text-align: center; padding: 22px 0 24px; color: var(--text); }
  .hero .logo { width: 112px; height: 112px; margin: 0 auto; position: relative; isolation: isolate; }
  .hero .logo svg { position: relative; z-index: 1; will-change: transform; }
  .hero .logo::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; z-index: 0;
                        background: radial-gradient(circle, rgba(143,128,255,.35), rgba(109,93,252,.12) 45%, transparent 70%); inset: -14%;
                        animation: halo 4s ease-in-out infinite; will-change: transform, opacity; }
  .hero .logo::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 14px; border-radius: 50%; z-index: 0;
                       background: none; }
  @keyframes halo { 50% { transform: scale(1.18); opacity: .6; } }
  .hero h1 { font-size: 26px; line-height: 1.12; margin: 16px 0 6px; font-weight: 700; letter-spacing: -.03em; }
  .hero p { margin: 0 auto; max-width: 300px; color: var(--hint); font-size: 14px; }

  /* ---------- model menu ---------- */
  .menu { position: absolute; top: 52px; left: 0; width: min(330px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; border-radius: 28px; padding: 8px;
          transform-origin: 30px 0; transform: scale(.6) translateY(-10px); opacity: 0; pointer-events: none; filter: blur(8px);
          transition: transform .5s var(--spring), opacity .25s, filter .3s; background: rgba(38,38,50,.96); }
  :root[data-theme="light"] .menu { background: rgba(255,255,255,.92); }
  .menu.open { transform: none; opacity: 1; pointer-events: auto; filter: none; }
  .menu button { display: flex; width: 100%; text-align: left; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; }
  .menu button:active, .menu button.on { background: rgba(255,255,255,.1); }
  .menu .t { font-weight: 600; font-size: 17px; }
  .menu .d { color: var(--hint); font-size: 14px; }
  .menu .check { margin-left: auto; color: var(--accent); opacity: 0; }
  .menu button.on .check { opacity: 1; }

  /* ---------- sections and lists ---------- */
  .section { margin-top: 26px; }
  .section > h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--hint); margin: 0 6px 2px; }
  .section > .sub { color: var(--hint-2); margin: 2px 6px 10px; font-size: 13px; }
  .section > h2 + .list { margin-top: 12px; }
  .list { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--line);
          backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; position: relative; min-height: 54px;
         transition: background-color .25s; }
  .row:active { background: rgba(255,255,255,.06); }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 16px; height: 1px; background: var(--line); }
  .row.compact + .row.compact::before { left: 56px; }
  .row .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; font-size: 30px; line-height: 1; overflow: hidden; }
  .row .ic.tile { background: rgba(255,255,255,.94); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .row .ic.tile img { width: 26px; height: 26px; object-fit: contain; }
  .row .ic.letter { background: linear-gradient(135deg, #3b2f9e, #6d5dfc); color: #fff; font-size: 17px; font-weight: 700; }
  .row .ic.sym { width: 28px; height: 28px; font-size: 20px; color: #b4a9ff; }
  .row .ic.line { width: 36px; height: 36px; border-radius: 11px; color: var(--tint, #b4a9ff);
                  background: color-mix(in srgb, var(--tint, #8f80ff) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tint, #8f80ff) 22%, transparent); }
  .row .ic.line svg { width: 18px; height: 18px; stroke-width: 1.7; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .d { color: var(--hint); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .d.ok { color: var(--ok); }
  .row .val { color: var(--hint); font-size: 14.5px; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { color: var(--hint-2); width: 18px; height: 18px; }
  .row.more { color: var(--accent); font-weight: 500; min-height: 56px; }
  .row.more .ic { width: 32px; height: 32px; color: var(--accent); }
  .row.danger { color: var(--danger); }
  /* swipe a group left: a red trash appears; deleting slides the row out and folds it */
  .swipe { position: relative; overflow: hidden; max-height: 200px; transition: max-height .32s cubic-bezier(.4,0,.2,1), opacity .32s; }
  .swipe.gone { max-height: 0 !important; opacity: 0; }
  .swipe + .swipe .row::before, .swipe + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 16px; height: 1px; background: var(--line); }
  .swipe .row { touch-action: pan-y; will-change: transform; }
  .swipe .row.anim { transition: transform .28s cubic-bezier(.2,.8,.2,1), background-color .25s; }
  .swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 0; display: flex; align-items: center; justify-content: center;
               flex-direction: column; gap: 3px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; overflow: hidden; }
  .swipe-del.anim { transition: width .28s cubic-bezier(.2,.8,.2,1); }
  .swipe-del svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .swipe-del span { white-space: nowrap; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; letter-spacing: .02em; text-transform: uppercase; }
  .badge.new { background: linear-gradient(135deg, #6d5dfc, #8b5cf6); color: #fff; }
  .badge.on { background: rgba(52,199,89,.18); color: var(--ok); }
  .badge.app { background: rgba(143,128,255,.14); color: #b4a9ff; text-transform: none; font-weight: 600; letter-spacing: 0; }
  .plus { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--text);
          transition: transform .45s var(--spring), background-color .3s, color .3s; }
  .plus svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .plus.on { background: rgba(52,199,89,.16); color: var(--ok); transform: rotate(360deg); }
  .plus.busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .save { color: var(--ok); font-size: 13px; font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 4px; }

  /* ---------- quick cards ---------- */
  .quick .row { min-height: 62px; }

  /* ---------- apps tab ---------- */
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -.03em; margin: 10px 4px 4px; }
  .page-sub { color: var(--hint); margin: 0 4px 16px; }
  .search { position: sticky; top: calc(var(--safe-top) + 8px); z-index: 5; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 14px;
            border-radius: 21px; margin-bottom: 14px; }
  .search input { flex: 1; background: none; border: 0; outline: none; height: 100%; font-size: 15px; }
  .search input::placeholder { color: var(--hint); }
  .search .i { color: var(--hint); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; white-space: nowrap; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .skeleton .ic, .skeleton .bar { background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 75%);
            background-size: 200% 100%; animation: shimmer 1.3s infinite; }
  :root[data-theme="light"] .skeleton .ic, :root[data-theme="light"] .skeleton .bar {
            background-image: linear-gradient(90deg, rgba(0,0,0,.05) 25%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.05) 75%); }
  .skeleton .bar { height: 12px; border-radius: 6px; margin: 6px 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { text-align: center; color: var(--hint); padding: 40px 20px; }
  .notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 22px; margin-bottom: 16px; font-size: 15px; color: var(--hint); }
  .notice b { color: var(--text); }

  /* ---------- tab bar ---------- */
  .tabbar { position: fixed; z-index: 20; left: 50%; bottom: calc(var(--safe-bottom) + 14px); transform: translateX(-50%);
            width: min(500px, calc(100vw - 32px)); height: 62px; border-radius: 31px; padding: 5px; display: grid; grid-template-columns: repeat(5, 1fr);
            background: rgba(14,14,20,.82); backdrop-filter: blur(28px) saturate(190%); -webkit-backdrop-filter: blur(28px) saturate(190%); }
  :root[data-theme="light"] .tabbar { background: rgba(255,255,255,.82); }
  body::after { content: ""; position: fixed; z-index: 19; left: 0; right: 0; bottom: 0; height: calc(var(--safe-bottom) + 110px); pointer-events: none;
                background: linear-gradient(to bottom, transparent, var(--bg) 78%); }
  .tabbar .lens { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 5); border-radius: 26px;
                  background: rgba(143,128,255,.13); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(143,128,255,.18);
                  transform: translateX(calc(var(--tab, 0) * 100%)); transition: transform .6s var(--spring); }
  :root[data-theme="light"] .tabbar .lens { background: rgba(0,0,0,.06); }
  .tabbar .lens.squish { animation: squish .6s var(--spring); }
  @keyframes squish { 30% { scale: 1.12 .9; } }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px;
         font-weight: 600; color: var(--hint); transition: color .3s; min-width: 0; letter-spacing: -.02em; }
  .tab span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .tab svg { width: 21px; height: 21px; stroke-width: 1.8; transition: transform .5s var(--spring); }
  .tab.on { color: #fff; }
  .tab.on svg { color: var(--accent); }
  .tab.on svg { transform: scale(1.1); }
  .tab .ghost-ic { width: 25px; height: 25px; }
  .tab .ghost-ic svg { width: 25px; height: 25px; }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto;
           border-radius: 34px 34px 0 0; padding: 14px 20px calc(var(--safe-bottom) + 24px);
           background: rgba(16,16,23,.92); transform: translateY(105%); transition: transform .55s var(--spring); }
  :root[data-theme="light"] .sheet { background: rgba(248,248,252,.88); }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--hint-2); margin: 0 auto 10px; }
  .sheet .close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .sheet .close svg { width: 18px; height: 18px; }
  .sheet .head { text-align: center; padding: 14px 8px 4px; }
  .sheet .big { width: 80px; height: 80px; border-radius: 22px; margin: 4px auto 14px; display: grid; place-items: center; background: #fff;
                box-shadow: 0 12px 34px rgba(0,0,0,.3); animation: pop .7s var(--spring) both; position: relative; }
  .sheet .big img { width: 60px; height: 60px; object-fit: contain; }
  .sheet .big.letter { background: linear-gradient(135deg, #3b2f9e, #6d5dfc); color: #fff; font-size: 40px; font-weight: 800; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .sheet h3 { font-size: 22px; margin: 0 0 6px; font-weight: 800; letter-spacing: -.02em; }
  .sheet .lead { color: var(--hint); margin: 0 0 18px; font-size: 14.5px; }
  .sheet .list { margin-bottom: 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 50px; border-radius: 25px; font-weight: 700; font-size: 16px;
         color: #fff; background: linear-gradient(135deg, #6d5dfc, #8b5cf6); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 30px rgba(109,93,252,.3);
         transition: transform .35s var(--spring), filter .2s, background .4s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { filter: saturate(.4) brightness(.8); }
  .btn.ok { background: linear-gradient(135deg, #30d158, #22a447); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(48,209,88,.35); }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--danger); height: 48px; margin-top: 6px; }
  .btn.link { background: none; box-shadow: none; color: var(--hint); font-weight: 600; font-size: 15px; height: 44px; margin-top: 6px; }
  .btn.secondary { background: rgba(255,255,255,.1); box-shadow: none; color: var(--text); margin-top: 10px; }
  .btn .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }
  .field { width: 100%; height: 48px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.06); outline: none;
           margin-bottom: 10px; transition: border-color .2s, box-shadow .2s; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(143,128,255,.16); }
  .small { color: var(--hint); font-size: 14px; margin: 6px 4px 14px; }
  .small a { color: var(--accent); text-decoration: none; }
  .waiting { position: absolute; inset: -10px; border-radius: 34px; border: 2px solid var(--accent); opacity: 0; }
  .big.wait .waiting { animation: ring 1.6s ease-out infinite; }
  .big.wait .waiting + .waiting { animation-delay: .8s; }
  @keyframes ring { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
  .done-check { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; background: var(--ok); display: grid; place-items: center;
                box-shadow: 0 0 0 4px var(--bg-2); animation: pop .6s var(--spring) both; }
  .done-check svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .2s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- secretary set-up: a looping phone demo of each step, like Mira ---------- */
  .demo { position: relative; height: 270px; margin: 6px -4px 0; border-radius: 22px 22px 0 0; overflow: hidden;
          background: linear-gradient(120deg, #ec4f9a 0%, #a855f7 38%, #6d6cf6 66%, #2f7bff 100%); }
  .demo .phone { position: absolute; left: 50%; top: 18px; width: 230px; height: 330px; margin-left: -115px; border-radius: 40px; padding: 7px;
                 background: linear-gradient(145deg, #3a3d4a, #15161c); box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.18); }
  .demo .scr { position: relative; height: 100%; border-radius: 33px; overflow: hidden; background: #f2f2f7; color: #111; font-size: 11px; }
  .demo .bar { height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-weight: 700; font-size: 11px; }
  .demo .island { position: absolute; top: 7px; left: 50%; width: 70px; height: 20px; margin-left: -35px; border-radius: 12px; background: #000; z-index: 3; }
  .demo .pg { position: absolute; inset: 30px 0 0; padding: 4px 12px; transition: transform .5s var(--spring), opacity .35s; opacity: 0; transform: translateX(40%); }
  .demo .pg.on { opacity: 1; transform: none; }
  .demo .pg.off { opacity: 0; transform: translateX(-30%); }
  .demo .top { display: flex; justify-content: space-between; align-items: center; height: 28px; }
  .demo .pill { padding: 5px 11px; border-radius: 14px; background: #fff; font-weight: 700; color: #007aff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .demo .rnd { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #fff; font-weight: 800; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .demo .rnd.ok { background: #c7c7cc; color: #fff; transition: background .3s, transform .3s var(--spring); }
  .demo .rnd.ok.lit { background: #007aff; transform: scale(1.12); }
  .demo .ava { width: 58px; height: 58px; border-radius: 50%; margin: 2px auto 6px; display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 800;
               background: linear-gradient(135deg, #6d5dfc, #3e8bff) center / cover; }
  .demo .nm { text-align: center; font-weight: 800; font-size: 14px; }
  .demo .un { text-align: center; color: #8e8e93; margin-bottom: 8px; }
  .demo .grp { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
  .demo .it { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: .5px solid #e5e5ea; transition: background .25s; }
  .demo .it:last-child { border-bottom: 0; }
  .demo .it i { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
  .demo .it span { flex: 1; } .demo .it em { color: #c7c7cc; font-style: normal; font-weight: 700; }
  .demo .it.hot { background: #e5f0ff; }
  .demo .mascot { width: 64px; height: 64px; margin: 0 auto; display: block; object-fit: contain; }
  .demo h5 { margin: 4px 0 2px; text-align: center; font-size: 14px; font-weight: 800; }
  .demo .sub { text-align: center; color: #3c3c43; margin-bottom: 8px; }
  .demo .inp { min-height: 30px; display: flex; align-items: center; padding: 0 10px; background: #fff; border-radius: 12px; margin-bottom: 8px; color: #8e8e93; }
  .demo .inp.typed { color: #111; font-weight: 600; }
  .demo .caret { width: 1.5px; height: 13px; background: #007aff; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .demo .tg { width: 30px; height: 18px; border-radius: 9px; background: #e5e5ea; position: relative; transition: background .25s; }
  .demo .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
                     box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .3s var(--spring); }
  .demo .tg.on { background: #34c759; } .demo .tg.on::after { transform: translateX(12px); }
  .demo .finger { position: absolute; z-index: 4; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; pointer-events: none;
                  background: rgba(255,255,255,.55); border: 2px solid rgba(0,0,0,.18); box-shadow: 0 4px 12px rgba(0,0,0,.25); opacity: 0;
                  transition: transform .7s cubic-bezier(.5,0,.2,1), opacity .3s; }
  .demo .finger.tap { animation: tap .35s ease; }
  @keyframes tap { 50% { scale: .7; background: rgba(0,122,255,.45); } }
  .steps { background: var(--card); border-radius: 0 0 22px 22px; margin: 0 -4px 14px; padding: 4px 0; }
  .step { display: flex; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); transition: opacity .3s; opacity: .55; cursor: pointer; }
  .step:last-child { border-bottom: 0; }
  .step.cur { opacity: 1; }
  .step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 800;
             font-size: 14px; transition: transform .3s var(--spring); }
  .step.cur .n { transform: scale(1.12); box-shadow: 0 0 0 5px rgba(62,139,255,.22); }
  .step .t { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .step .d { color: var(--hint); font-size: 13.5px; margin-top: 3px; line-height: 1.35; }
  .step b { color: var(--accent); }
  .sec-ready { text-align: center; font-weight: 700; color: var(--ok); margin: -2px 0 16px; }
  .premium-note { text-align: center; color: var(--hint); font-size: 13px; margin: -4px 0 12px; }

  .paid { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 9px; margin-left: 4px; color: #fff;
          background: linear-gradient(135deg, #a855f7, #3e8bff); vertical-align: 1px; }
  /* ---------- toast ---------- */
  .toast { position: fixed; z-index: 50; left: 50%; top: calc(var(--safe-top) + 12px); transform: translate(-50%, -140%); max-width: calc(100vw - 32px);
           padding: 12px 18px; border-radius: 22px; font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center;
           background: rgba(40,40,50,.7); color: #fff; transition: transform .55s var(--spring); }
  :root[data-theme="light"] .toast { background: rgba(255,255,255,.8); color: var(--text); }
  .toast.show { transform: translate(-50%, 0); }

  /* ---------- generation ---------- */
  .wallet { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; margin-bottom: 14px; }
  .wallet .k { color: var(--hint); font-size: 14px; }
  .wallet .v { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .wallet .v small { font-size: 14px; color: var(--hint); font-weight: 600; }
  .wallet .grow { flex: 1; min-width: 0; }
  .pill-btn { height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14.5px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
              box-shadow: 0 6px 18px rgba(109,93,252,.3); white-space: nowrap; }
  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tpl { position: relative; height: 122px; border-radius: 20px; overflow: hidden; text-align: left; padding: 14px; color: var(--text);
         display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid color-mix(in srgb, var(--c1) 22%, rgba(255,255,255,.06));
         background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--c1) 30%, transparent), transparent 62%),
                     radial-gradient(90% 70% at 0% 100%, color-mix(in srgb, var(--c2) 16%, transparent), transparent 70%), #101017;
         box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 26px rgba(0,0,0,.35); }
  .tpl .e { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center;
            color: color-mix(in srgb, var(--c1) 70%, #fff); background: color-mix(in srgb, var(--c1) 16%, transparent);
            transition: transform .5s var(--spring); }
  .tpl .e svg { width: 20px; height: 20px; stroke-width: 1.7; }
  .tpl:active .e { transform: scale(1.1) rotate(-6deg); }
  .tpl b { font-size: 15px; font-weight: 600; }
  .tpl span { font-size: 12px; color: var(--hint); }
  .tpl .kind { position: absolute; top: 14px; left: 14px; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 7px; color: var(--hint);
               background: rgba(255,255,255,.06); letter-spacing: .05em; text-transform: uppercase; }
  textarea.field { height: 120px; padding: 14px 16px; resize: none; line-height: 1.35; font: inherit; color: var(--text); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 14px; }
  .seg button { height: 44px; border-radius: 16px; font-weight: 600; font-size: 15px; background: rgba(255,255,255,.07); border: 1px solid var(--line);
                transition: background .25s, color .25s, transform .35s var(--spring); }
  .seg.four { grid-template-columns: repeat(4, 1fr); }
  .seg.four button { font-size: 13.5px; height: 40px; }
  .switch { width: 50px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.14); position: relative; flex: none;
            transition: background .3s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
                   box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .4s var(--spring); }
  .switch.on { background: #34c759; }
  .switch.on::after { transform: translateX(20px); }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 12px; }
  .thumbs .t { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.06);
               border: 1px dashed var(--line); display: grid; place-items: center; color: var(--hint); }
  .thumbs .t img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs .t .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.6);
                  color: #fff; font-size: 14px; line-height: 22px; text-align: center; }
  .phrases { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .phrases span { padding: 6px 12px; border-radius: 14px; background: rgba(143,128,255,.12); color: #cfc8ff; font-size: 13.5px; }
  .recent-item { padding: 12px 14px; }
  .recent-item + .recent-item { border-top: 1px solid var(--line); }
  .recent-item .who { font-size: 13px; color: var(--hint); }
  .recent-item .said { font-size: 14px; margin: 2px 0 4px; }
  .recent-item .ans { font-size: 14px; color: #cfc8ff; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px; }
  .stat-row div { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; }
  .stat-row b { display: block; font-size: 20px; }
  .stat-row span { font-size: 12px; color: var(--hint); }
  .seg button.on { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(79,140,255,.35); }
  .cost { text-align: center; color: var(--hint); font-size: 14px; margin: 2px 0 12px; }
  .packs { display: grid; gap: 10px; margin-bottom: 8px; }
  .pack { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 22px; background: rgba(255,255,255,.07);
          border: 1px solid var(--line); text-align: left; }
  .pack.best { border-color: rgba(255,214,10,.55); background: linear-gradient(135deg, rgba(255,214,10,.14), rgba(255,159,10,.08)); }
  .pack .n { font-size: 20px; font-weight: 800; }
  .pack .s { margin-left: auto; font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 6px; }

  .footer { text-align: center; color: var(--hint-2); font-size: 13px; margin-top: 28px; }
  .footer .mini { width: 44px; height: 44px; margin: 0 auto 6px; opacity: .8; }

  /* ================= Midnight aurora skin: deep night, glass, a violet-to-cyan glow ================= */
  :root {
    --bg: #07070d; --bg-2: #11111b; --card: rgba(255,255,255,.045); --card-solid: #12121c; --card-hi: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.07); --text: #f4f4fb; --hint: rgba(228,228,245,.56); --hint-2: rgba(228,228,245,.28);
    --accent: #8b7bff; --accent-2: #2fd5f0; --accent-3: #ff6ad5;
    --brand: linear-gradient(120deg, #7b6bff 0%, #b36bff 45%, #2fd5f0 100%);
    --brand-soft: linear-gradient(120deg, rgba(123,107,255,.22), rgba(47,213,240,.14));
    --rim: inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(255,255,255,.055);
    --lift: 0 18px 40px -18px rgba(0,0,0,.7);
  }
  :root[data-theme="light"] {
    --bg: #f3f2f8; --bg-2: #fff; --card: rgba(255,255,255,.78); --card-solid: #fff; --card-hi: #fff;
    --line: rgba(40,30,90,.08); --text: #15131f; --hint: rgba(40,36,70,.58); --hint-2: rgba(40,36,70,.3);
    --accent: #6a58f5; --rim: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(40,30,90,.06);
    --lift: 0 16px 34px -18px rgba(60,40,140,.35);
  }
  body { font-family: "Inter", -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); }

  /* aurora: three slow blobs over the night, a fine dot grid fading out */
  .backdrop { position: fixed; inset: -10% -20% auto; height: 760px; opacity: 1 !important; overflow: hidden; filter: saturate(115%);
    background:
      radial-gradient(38% 34% at 22% 18%, rgba(123,107,255,.42), transparent 70%),
      radial-gradient(34% 30% at 82% 10%, rgba(47,213,240,.26), transparent 70%),
      radial-gradient(40% 32% at 60% 42%, rgba(255,106,213,.16), transparent 70%);
    animation: aurora 18s ease-in-out infinite alternate; }
  .backdrop::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.2px); background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 55%); mask-image: linear-gradient(180deg, #000 0%, transparent 55%); }
  @keyframes aurora { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-4%,2%,0) scale(1.08); } 100% { transform: translate3d(3%,-2%,0) scale(1.04); } }
  body:not([data-tab="agent"]) .backdrop { opacity: .55 !important; }
  :root[data-theme="light"] .backdrop { background:
      radial-gradient(38% 34% at 22% 18%, rgba(123,107,255,.28), transparent 70%),
      radial-gradient(34% 30% at 82% 10%, rgba(47,213,240,.22), transparent 70%),
      radial-gradient(40% 32% at 60% 42%, rgba(255,106,213,.14), transparent 70%); }
  :root[data-theme="light"] .backdrop::after { background-image: radial-gradient(rgba(60,40,140,.16) 1px, transparent 1.2px); }

  html, body { overflow-x: hidden; max-width: 100vw; }
  main { overflow-x: hidden; }

  /* glass everywhere: soft fill, hairline rim, deep shadow */
  .glass { background: rgba(22,22,34,.55); border: 0; box-shadow: var(--rim), var(--lift);
           backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%); }
  :root[data-theme="light"] .glass { background: rgba(255,255,255,.7); }
  :root[data-theme="light"] .pill.cta, .pill.cta.glass { background: var(--brand); }

  /* top bar */
  .topbar { flex-wrap: nowrap; }
  .pill { height: 40px; padding: 0 15px; border-radius: 20px; font-size: 15px; font-weight: 600; min-width: 0; color: var(--text); }
  #model-btn { flex: 0 1 auto; max-width: 58%; }
  #model-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent-2);
                       box-shadow: 0 0 0 3px rgba(47,213,240,.18), 0 0 12px var(--accent-2); }
  .pill .model-name { max-width: 100%; }
  .pill.cta { flex: 0 0 auto; color: #fff; background: var(--brand); box-shadow: 0 10px 26px -8px rgba(123,107,255,.7), inset 0 1px 0 rgba(255,255,255,.3); }
  .pill.cta svg { color: #fff; }
  .menu { top: 50px; border-radius: 24px; background: rgba(20,20,32,.94); box-shadow: var(--rim), 0 30px 60px -20px rgba(0,0,0,.8); }
  :root[data-theme="light"] .menu { background: rgba(255,255,255,.96); }
  .menu button { border-radius: 16px; }
  .menu button.on { background: var(--brand-soft); }
  .menu .t { font-size: 16px; }
  .menu .d { font-size: 13px; }

  /* hero: the mascot in a glowing orb with a slowly turning ring */
  .hero { padding: 26px 0 22px; }
  .hero .logo { width: 116px; height: 116px; }
  .hero .logo::before { display: block; content: ""; position: absolute; inset: -16px; border-radius: 50%; z-index: 0; opacity: 1;
    background: conic-gradient(from 0deg, #7b6bff, #2fd5f0, #ff6ad5, #b36bff, #7b6bff);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    animation: ring-spin 9s linear infinite; }
  .hero .logo::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; z-index: 0; left: -6px; right: -6px; bottom: -6px; height: auto;
    background: radial-gradient(circle, rgba(139,123,255,.45), rgba(47,213,240,.12) 55%, transparent 72%); filter: blur(6px);
    animation: halo 4.5s ease-in-out infinite; }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  .hero .edit-btn { position: absolute; right: -8px; bottom: -4px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
                    display: grid; place-items: center; color: #fff; background: var(--brand);
                    box-shadow: 0 0 0 3px var(--bg), 0 8px 20px -6px rgba(123,107,255,.8); }
  .hero .edit-btn svg { width: 15px; height: 15px; }
  .hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -.035em; margin: 22px 0 6px;
             background: linear-gradient(180deg, var(--text) 30%, color-mix(in srgb, var(--text) 62%, var(--accent))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { display: block; max-width: 300px; font-size: 14.5px; line-height: 1.45; color: var(--hint); }

  /* sections: a small glowing eyebrow line, then a confident title */
  .section { margin-top: 32px; }
  .section > h2 { position: relative; font-size: 20px; font-weight: 750; letter-spacing: -.025em; text-transform: none; color: var(--text); margin: 0 6px 2px; padding-left: 14px; }
  .section > h2::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 4px; border-radius: 2px; background: var(--brand); }
  .section > .sub { font-size: 13.5px; color: var(--hint); margin: 3px 6px 12px 20px; }
  .section > h2 + .list { margin-top: 12px; }
  .section > h2.cap { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--hint); padding-left: 0; margin: 0 10px 8px; }
  .section > h2.cap::before { display: none; }

  /* cards and rows */
  .list { background: var(--card); border: 0; border-radius: 22px; box-shadow: var(--rim);
          backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); }
  .row { padding: 11px 14px; min-height: 60px; gap: 13px; }
  .row:active { background: var(--card-hi); }
  .row + .row::before { left: 67px; right: 14px; background: var(--line); }
  .row.compact + .row.compact::before { left: 60px; }
  .row .t { font-size: 15.5px; font-weight: 600; letter-spacing: -.015em; flex-wrap: nowrap; }
  .row .t > .badge { flex: none; }
  .row .d { font-size: 13px; margin-top: 1px; }
  .row .val { font-size: 14.5px; }
  .row .chev { width: 17px; height: 17px; color: var(--hint-2); }
  .row .ic.emoji { width: 40px; height: 40px; border-radius: 13px; font-size: 22px;
                   background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); box-shadow: var(--rim); }
  :root[data-theme="light"] .row .ic.emoji { background: linear-gradient(145deg, #fff, #efedf8); }
  .row .ic.spark { width: 40px; height: 40px; border-radius: 13px; background: var(--brand-soft); box-shadow: var(--rim); }
  .row .ic.spark svg { width: 22px; height: 22px; }
  .row .ic.sym { width: 34px; height: 34px; border-radius: 11px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .row .ic.sym svg { width: 19px; height: 19px; stroke-width: 1.9; }
  .row .ic.tile { border-radius: 12px; }
  .row .ic.letter { border-radius: 12px; background: var(--brand); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .row.more { color: var(--accent); font-size: 15.5px; font-weight: 600; }
  .row.more .ic { color: var(--accent); }
  .quick .row { min-height: 66px; }
  .quick .row + .row::before { left: 67px; }
  .badge { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 7px; letter-spacing: .05em; }
  .badge.new { background: var(--brand); color: #fff; box-shadow: 0 4px 12px -4px rgba(123,107,255,.8); }
  .badge.pro { background: linear-gradient(135deg, #ffb340, #ff6ad5); color: #fff; }
  .save { font-size: 12.5px; font-weight: 600; color: #3ee0a0; }
  .plus { width: 34px; height: 34px; background: var(--card-hi); }
  .plus svg { width: 20px; height: 20px; }
  .switch { background: rgba(255,255,255,.12); }
  .switch.on { background: linear-gradient(120deg, #7b6bff, #2fd5f0); }

  /* page titles on the other tabs */
  .page-title { font-size: 32px; font-weight: 800; letter-spacing: -.04em; margin: 14px 6px 4px; }
  .page-sub { font-size: 14.5px; color: var(--hint); margin: 0 6px 18px; }
  .search { background: var(--card); box-shadow: var(--rim); }
  .chip { background: var(--card); box-shadow: var(--rim); border: 0; }
  .chip.on { background: var(--brand); color: #fff; }

  /* generation */
  .wallet { position: relative; overflow: hidden; border-radius: 24px; padding: 18px 18px; background: var(--card); box-shadow: var(--rim); backdrop-filter: none; }
  .wallet::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 120% at 100% 0%, rgba(123,107,255,.28), transparent 60%); pointer-events: none; }
  .wallet .v { font-size: 24px; }
  .pill-btn { height: 38px; padding: 0 18px; border-radius: 19px; font-size: 15px; font-weight: 700; background: var(--brand); box-shadow: 0 10px 22px -8px rgba(123,107,255,.8); position: relative; }
  .tpl-grid { gap: 10px; }
  .tpl { height: 146px; border-radius: 22px; box-shadow: var(--rim), var(--lift); }
  .tpl .e { width: auto; height: auto; background: none; top: 14px; right: 14px; font-size: 32px; line-height: 1; }
  .tpl b { font-size: 16.5px; font-weight: 700; color: #fff; }
  .seg button { background: var(--card); border: 0; box-shadow: var(--rim); }
  .seg button.on { background: var(--brand); box-shadow: 0 8px 20px -8px rgba(123,107,255,.8); }
  .pack { background: var(--card); border: 0; box-shadow: var(--rim); }
  .pack.best { background: linear-gradient(135deg, rgba(255,179,64,.18), rgba(255,106,213,.12)); box-shadow: inset 0 0 0 1px rgba(255,179,64,.45); }

  /* the floating tab bar: dark glass, a glowing lens under the current tab */
  .tabbar { grid-template-columns: repeat(5, 1fr); height: 66px; border-radius: 33px; padding: 6px;
            background: rgba(16,16,26,.72); box-shadow: var(--rim), 0 24px 50px -16px rgba(0,0,0,.85); }
  :root[data-theme="light"] .tabbar { background: rgba(255,255,255,.78); }
  .tabbar .lens { top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 27px;
                  background: var(--brand-soft); box-shadow: inset 0 0 0 1px rgba(139,123,255,.35), 0 0 24px -6px rgba(123,107,255,.6); }
  .tabbar .lens.hidden { opacity: 0; }
  .tab { font-size: 10.5px; font-weight: 600; color: var(--hint); gap: 3px; letter-spacing: -.03em; }
  .tab svg { width: 24px; height: 24px; stroke-width: 1.8; }
  .tab .ghost-ic, .tab .ghost-ic svg { width: 26px; height: 26px; }
  .tab .ghost-ic rect { fill: var(--bg); }
  .tab.on { color: var(--text); }
  .tab.on svg { color: var(--accent); transform: translateY(-1px); filter: drop-shadow(0 0 8px rgba(139,123,255,.7)); }
  body::after { background: linear-gradient(to bottom, transparent, var(--bg) 72%); }

  /* sheets, buttons, fields, toasts */
  .scrim { background: rgba(4,4,10,.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .sheet { background: rgba(16,16,26,.96); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 -20px 60px -20px rgba(0,0,0,.8); border-radius: 30px 30px 0 0; }
  .sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 160px; border-radius: inherit; pointer-events: none;
                   background: radial-gradient(70% 100% at 50% 0%, rgba(123,107,255,.2), transparent 70%); }
  :root[data-theme="light"] .sheet { background: rgba(250,250,255,.97); }
  .sheet .big { border-radius: 24px; box-shadow: var(--rim), 0 16px 36px -10px rgba(0,0,0,.6); }
  .sheet .big.letter { background: var(--brand); }
  .btn { background: var(--brand); background-size: 160% 100%; box-shadow: 0 14px 30px -10px rgba(123,107,255,.85), inset 0 1px 0 rgba(255,255,255,.3);
         transition: transform .35s var(--spring), background-position .6s var(--ease), filter .2s; }
  .btn:hover { background-position: 100% 0; }
  .btn.ok { background: linear-gradient(120deg, #2fd58a, #2fd5f0); }
  .btn.secondary { background: var(--card-hi); box-shadow: var(--rim); }
  .field { background: var(--card); border: 0; box-shadow: var(--rim); border-radius: 16px; }
  .field:focus { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(139,123,255,.16); }
  .toast { background: rgba(24,24,38,.82); box-shadow: var(--rim), 0 16px 40px -12px rgba(0,0,0,.8); }
  .steps { background: var(--card); box-shadow: var(--rim); }
  .step .n { background: var(--brand); }
  .phrases span { background: var(--brand-soft); color: var(--text); }
  .stat-row div { background: var(--card); border: 0; box-shadow: var(--rim); }
  .footer { margin-top: 34px; }

            background: var(--brand); box-shadow: 0 18px 40px -12px rgba(123,107,255,.8), inset 0 1px 0 rgba(255,255,255,.35); }
  .cx-orb svg { width: 36px; height: 36px; stroke-width: 1.9; }

  .cx-empty h2 { margin: 0 0 8px; font-size: 25px; font-weight: 800; letter-spacing: -.035em; }

  .cx-modes { display: inline-flex; padding: 4px; gap: 4px; border-radius: 16px; background: var(--card); box-shadow: var(--rim); margin-bottom: 14px; }

                       white-space: pre-wrap; word-break: break-word; box-shadow: 0 10px 24px -12px rgba(123,107,255,.9); }

  .cx-think { display: inline-flex; gap: 4px; padding: 4px 0 10px; }
  .cx-think i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: dots 1.2s ease-in-out infinite; }

  .cx-st { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: 10.5px; letter-spacing: .03em; }

  .cx-composer { display: none; position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); width: min(528px, calc(100vw - 24px));

  .cx-model { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; margin-bottom: 8px; border-radius: 16px; font-size: 14.5px; font-weight: 700;

  .cx-input { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 26px; background: rgba(22,22,34,.82); box-shadow: var(--rim), 0 18px 40px -16px rgba(0,0,0,.85);

function playSetupDemo() {
  const demo = $("demo"), scr = $("demo-scr"), finger = $("d-finger"), bot = "@" + (state.bot || "bot");
  const STEP_AT = [0, 3.2, 6.4], LOOP = 6.4 + 1.2 + bot.length * .11 + 4;
  let start = performance.now(), last = {};
  const pointAt = el => {  // the finger goes to the middle of an element, from the layout (the page may still be sliding in)
    let x = el.offsetWidth / 2, y = el.offsetHeight / 2;
    for (let n = el; n && n !== scr; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
    finger.style.transform = `translate(${x}px, ${y}px)`;
  };
  const once = (key, fn) => { if (!last[key]) { last[key] = true; fn(); } };
  demo.parentElement.querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    start = performance.now() - STEP_AT[+el.dataset.step] * 1000; last = {}; haptic("select");
  });
  if ($("sec-connect")) $("sec-connect").onclick = () => {
    navigator.clipboard?.writeText(bot).catch(() => {});
    toast(T.secCopied.replace("{bot}", state.bot || "bot"), "📋"); haptic("success");
  };
  const frame = now => {
    if (!document.body.contains(demo)) return;  // the sheet was closed
    let t = (now - start) / 1000;
    if (t > LOOP) { start = now; t = 0; last = {}; }
    const page = t < STEP_AT[1] ? 0 : t < STEP_AT[2] ? 1 : 2;
    if (last.page !== page) {
      last = { page };
      demo.querySelectorAll(".pg").forEach(p => { const n = +p.dataset.pg; p.className = "pg" + (n === page ? " on" : n < page ? " off" : ""); });
      demo.parentElement.querySelectorAll(".step").forEach(s => s.classList.toggle("cur", +s.dataset.step === page));
      finger.style.opacity = 0; finger.classList.remove("tap");
      $("d-auto").classList.remove("hot"); $("d-tg").classList.remove("on"); $("d-ok").classList.remove("lit");
      $("d-inp").className = "inp"; $("d-inp").textContent = T.secDemo.field;
    }
    const local = t - STEP_AT[page];
    const tap = (key, at, el, after) => {
      if (local > at - .9) once(key + "move", () => { finger.style.opacity = 1; pointAt(el); });
      if (local > at) once(key, () => { finger.classList.remove("tap"); void finger.offsetWidth; finger.classList.add("tap"); after?.(); });
    };
    if (page === 0) tap("edit", 1.9, $("d-edit"));
    if (page === 1) tap("auto", 1.9, $("d-auto"), () => $("d-auto").classList.add("hot"));
    if (page === 2) {
      tap("inp", .9, $("d-inp"));
      const typed = Math.max(0, Math.min(bot.length, Math.floor((local - 1.2) / 0.11)));
      if (local > 1.2 && last.typed !== typed) {
        last.typed = typed;
        $("d-inp").className = "inp typed"; $("d-inp").innerHTML = esc(bot.slice(0, typed)) + '<span class="caret"></span>';
      }
      const typedEnd = 1.2 + bot.length * .11;
      tap("tg", typedEnd + 1, $("d-tg"), () => $("d-tg").classList.add("on"));
      tap("ok", typedEnd + 2.3, $("d-ok"), () => $("d-ok").classList.add("lit"));
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* Swipe a group row left to reveal the trash; past half way it stays open, a tap closes it. */
const SWIPE_OPEN = 88;
let openSwipe = null;
function swipeRow(el, g) {
  const row = el.querySelector(".row"), del = el.querySelector(".swipe-del");
  let x0 = 0, y0 = 0, dx = 0, base = 0, dragging = false, decided = false, moved = false;
  const set = (x, animate) => {
    row.classList.toggle("anim", animate); del.classList.toggle("anim", animate);
    row.style.transform = x ? `translateX(${x}px)` : ""; del.style.width = `${-x}px`;
  };
  const close = () => { set(0, true); if (openSwipe === close) openSwipe = null; };
  row.addEventListener("touchstart", e => {
    if (openSwipe && openSwipe !== close) openSwipe();
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; dragging = true; decided = false; moved = false;
    base = row.style.transform ? -SWIPE_OPEN : 0;
  }, { passive: true });
  row.addEventListener("touchmove", e => {
    if (!dragging) return;
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      decided = true;
      if (Math.abs(my) > Math.abs(mx)) { dragging = false; return; }  // a vertical scroll, not a swipe
    }
    moved = true;
    dx = Math.min(0, base + mx);
    if (dx < -SWIPE_OPEN) dx = -SWIPE_OPEN + (dx + SWIPE_OPEN) * .3;  // a little rubber band past the trash
    set(dx, false);
  }, { passive: true });
  row.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    if (!moved) return;
    if (dx < -SWIPE_OPEN / 2) { set(-SWIPE_OPEN, true); openSwipe = close; haptic("light"); } else close();
  });
  row.onclick = e => {
    if (moved) { moved = false; return; }
    if (row.style.transform) { close(); return; }
    openGroupSheet(g);
  };
  del.onclick = () => {
    haptic("warning");
    const go = async ok => {
      if (!ok) { close(); return; }
      try {
        const data = await api("/api/groups/delete", { chat_id: g.id });
        set(-el.offsetWidth, true);  // slide out, then fold the gap
        setTimeout(() => el.classList.add("gone"), 180);
        setTimeout(() => { state.groups = data.groups; renderGroups(); }, 520);
        haptic("success"); toast(T.gDeleted);
      } catch (e) { close(); toast(e.code === "group_admin" ? T.errGroupDelete : errorText(e)); haptic("error"); }
    };
    tg?.showConfirm ? tg.showConfirm(T.gDeleteAsk(g.title), go) : go(window.confirm(T.gDeleteAsk(g.title)));
  };
}

const catalog = {
  items: [], featured: [], next: null, total: null, q: "", loading: false, loaded: false, seq: 0,
  find(slug) { return this.items.find(a => a.slug === slug) || this.featured.find(a => a.slug === slug); },
};
async function loadCatalog(reset) {
  if (catalog.loading && !reset) return;
  const seq = ++catalog.seq;
  catalog.loading = true;
  if (reset) { catalog.items = []; catalog.next = null; renderCatalog(true); }
  try {
    const data = await api("/api/catalog", { q: catalog.q, after: reset ? "" : catalog.next || "" });
    if (seq !== catalog.seq) return;
    catalog.items = reset ? data.apps : catalog.items.concat(data.apps);
    catalog.next = data.next;
    if (data.total) catalog.total = data.total;
    if (!catalog.q && reset) { catalog.featured = data.apps; if (state) renderHomeApps(); }
    catalog.loaded = true;
  } catch (e) { if (seq === catalog.seq) toast(errorText(e)); }
  finally { if (seq === catalog.seq) { catalog.loading = false; renderCatalog(); } }
}
function renderCatalog(skeleton = false) {
  $("apps-sub").textContent = T.appsSub(catalog.total);
  const el = $("catalog");
  if (skeleton) {
    el.innerHTML = Array.from({ length: 6 }, () => `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:40%"></div><div class="bar" style="width:75%"></div></div></div>`).join("");

  const mine = connectedSlugs();
  const items = catalog.items.filter(a => !mine.has(a.slug));
  el.classList.add("stagger");
  el.innerHTML = items.length ? items.map((a, i) => appRow(a, i % 40)).join("") : `<div class="empty">${T.none}</div>`;
  if (catalog.next) el.insertAdjacentHTML("beforeend", `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:50%"></div></div></div>`);
}

/* ---------------- sheets ---------------- */
let sheetClose = null, sheetSeq = 0;
function openSheet(html, onClose) {
  const seq = ++sheetSeq;
  const sheet = $("sheet");
  sheet.innerHTML = `<div class="grab"></div><button class="close glass press" aria-label="close">${ICON.close}</button>` + html;
  sheet.querySelector(".close").onclick = closeSheet;
  sheet.querySelectorAll("[data-link]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openLink(a.dataset.link); }));
  // Opened on the next frame for the slide-in; skipped if the sheet was closed (or replaced) meanwhile.
  requestAnimationFrame(() => { if (seq !== sheetSeq) return; sheet.classList.add("open"); $("scrim").classList.add("open"); });
  sheetClose = onClose || null;
  tg?.BackButton?.show();
  haptic("medium");
}
function closeSheet() {
  sheetSeq++;
  $("sheet").classList.remove("open");
  $("scrim").classList.remove("open");
  tg?.BackButton?.hide();
  stopWaiting();
  const fn = sheetClose; sheetClose = null; fn?.();
}
$("scrim").onclick = closeSheet;
tg?.BackButton?.onClick(closeSheet);
// Swipe the sheet down to close.
(() => {
  let y0 = null, dy = 0;
  const s = $("sheet");
  s.addEventListener("touchstart", e => { if (s.scrollTop <= 0) { y0 = e.touches[0].clientY; s.style.transition = "none"; } }, { passive: true });
  s.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); s.style.transform = `translateY(${dy}px)`; }, { passive: true });
  s.addEventListener("touchend", () => { if (y0 === null) return; s.style.transition = ""; s.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; dy = 0; });
})();

let waitTimer = null;
function stopWaiting() { clearInterval(waitTimer); waitTimer = null; }
// Poll /api/state until done(state) is true. A tick that finishes after the sheet was closed (or a newer
// poll started) is ignored, so a late answer can never animate or close a sheet the user already left.
function pollState(fresh, done, onDone, onTimeout) {
  stopWaiting();
  const started = Date.now();
  const timer = setInterval(async () => {
    if (Date.now() - started > 5 * 60 * 1000) { if (waitTimer === timer) { stopWaiting(); onTimeout(); } return; }
    if (document.hidden) return;
    const s = await load(fresh);
    if (waitTimer !== timer) return;
    if (done(s)) { stopWaiting(); onDone(); }
  }, 2500);
  waitTimer = timer;
}

function openAppSheet(app, opts = {}) {
  if (app.slug === "github") return openGitHubSheet();
  const account = (state?.apps?.connected || []).find(a => a.slug === app.slug);
  const icon = app.img ? `<div class="big" id="big"><img src="${esc(app.img)}" alt=""><span class="waiting"></span><span class="waiting"></span></div>`
                       : `<div class="big letter" id="big">${esc((app.name || "?")[0])}<span class="waiting"></span><span class="waiting"></span></div>`;
  const lead = opts.needs ? T.needsAppSub : esc(app.description || "");
  if (account) {
    openSheet(`<div class="head">${icon}<h3>${esc(app.name)}</h3><p class="lead"><span class="badge on">${T.connected}</span> ${esc(account.account || "")}</p></div>
      <button class="btn" id="try">${T.tryAsk}</button>
      <button class="btn ghost" id="off">${T.disconnect}</button>`);
    $("big").insertAdjacentHTML("beforeend", `<span class="done-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`);
    $("try").onclick = () => { closeSheet(); sendToChat(lang === "ru" ? `Что ты можешь сделать с моим ${app.name}? Предложи 3 полезных действия.` : `What can you do with my ${app.name}? Suggest 3 useful actions.`); };
    $("off").onclick = () => confirm(T.disconnectAsk(app.name), async () => {
      try { state = await api("/api/apps/disconnect", { id: account.id }); renderAll(); closeSheet(); toast(T.removed); haptic("warning"); }
      catch (e) { toast(errorText(e)); }
    });
    return;
  }
  const available = app.direct || state.apps.enabled;
  openSheet(`<div class="head">${icon}<h3>${opts.needs ? esc(T.needsApp(app.name)) : esc(app.name)}</h3><p class="lead" id="lead">${available ? lead : T.notReadyApp}</p></div>
    ${available ? `<button class="btn" id="go">${esc(T.connectApp(app.name))}</button>` : ""}`);
  if (!available) return;
  $("go").onclick = () => startConnect(app, opts);
}

async function startConnect(app, opts) {
  const btn = $("go");
  if (!app.direct && !state.apps.enabled) { toast(T.notReady); haptic("warning"); return; }
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${T.opening}`;
  try {
    const { url } = await api("/api/apps/connect", { slug: app.slug });
    openLink(url);
    $("big")?.classList.add("wait");
    $("lead").textContent = T.waitingSub;
    btn.innerHTML = `<span class="spinner"></span>${T.waiting}`;
    const before = new Set((state.apps.connected || []).map(a => a.id));
    pollState(true, s => (s?.apps?.connected || []).some(a => a.slug === app.slug && !before.has(a.id)),
      () => connectedAnimation(app, opts),
      () => { btn.disabled = false; btn.textContent = T.connectApp(app.name); });
  } catch (e) {
    btn.disabled = false; btn.textContent = T.connectApp(app.name);
    toast(errorText(e)); haptic("error");
  }
}
function connectedAnimation(app, opts) {
  const big = $("big");
  if (!big || !$("sheet").classList.contains("open")) return;
  haptic("success");
  big.classList.remove("wait");
  big.insertAdjacentHTML("beforeend", `<span class="done-check"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>`);
  document.querySelector("#sheet h3").textContent = T.connectedTo(app.name);
  $("lead").textContent = T.connectedSub;
  const btn = $("go");
  btn.disabled = false;
  btn.classList.add("ok");
  btn.innerHTML = opts.then ? `${T.runIt} ✨` : `${ICON.check} ${T.connected}`;
  btn.onclick = () => { closeSheet(); if (opts.then) sendToChat(opts.then); };
  if (!opts.then) setTimeout(() => { if ($("go") === btn && $("sheet").classList.contains("open")) closeSheet(); }, 1800);
}

function confirm(text, ok) {
  if (tg?.showConfirm && tg.isVersionAtLeast?.("6.2")) tg.showConfirm(text, yes => yes && ok());

}

]);
const GEN_ICON = {

};
function genCost(kind, seconds = 5) {
  const g = state.gen;
  if (g.unlimited) return T.costOwner;

}

  const wallet = g.unlimited
    ? `<div class="wallet glass"><div class="grow"><div class="k">${T.myGen}</div><div class="v">∞ <small>${T.unlimited}</small></div></div></div>`

         <div class="v"><span style="color:#b4a9ff;display:inline-flex">${lineIcon("✨")}</span> ${g.credits} <small>${T.credits(g.credits).replace(/^\d+\s*/, "")}</small></div></div>

const EDIT_ICON = '<svg class="i" viewBox="0 0 24 24"><path d="m4 20 10-10M14 10l2-2M18 3l.6 1.6L20 5.2l-1.4.6L18 7.5l-.6-1.7L16 5.2l1.4-.6z"/><rect x="3" y="12" width="9" height="9" rx="2"/></svg>';
function shrinkPhoto(file) {
  // Big phone photos are scaled down in the browser (max 1536 px) so the upload stays small.
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1536 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.88));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function openEditSheet() {
  const photos = [];
  openSheet(`<div class="head"><div class="big letter" style="background:linear-gradient(135deg,#6d5dfc,#f472b6)">${EDIT_ICON.replace('class="i"', 'class="i" style="width:40px;height:40px;stroke:#fff"')}</div>
      <h3>${T.makeEdit}</h3><p class="lead">${T.editLead}</p></div>
    <div class="thumbs" id="edit-thumbs"></div>
    <input type="file" id="edit-file" accept="image/*" multiple style="display:none">
    <textarea class="field" id="edit-prompt" placeholder="${T.editPh}"></textarea>
    <div class="small" id="edit-cost"></div>
    <button class="btn" id="edit-go">${T.editGo}</button>`);
  const draw = () => {
    $("edit-thumbs").innerHTML = photos.map((p, i) => `<div class="t"><img src="${p}" alt=""><span class="x" data-del="${i}">×</span></div>`).join("")
      + (photos.length < 4 ? `<button class="t press" id="edit-add">${ICON.plus}</button>` : "");
    $("edit-add")?.addEventListener("click", () => $("edit-file").click());
    $("edit-thumbs").querySelectorAll("[data-del]").forEach(x => x.onclick = () => { photos.splice(+x.dataset.del, 1); draw(); });
  };
  $("edit-file").onchange = async e => {
    for (const f of [...e.target.files].slice(0, 4 - photos.length)) {
      try { photos.push(await shrinkPhoto(f)); } catch (err) {}
    }
    e.target.value = ""; draw();
  };
  $("edit-cost").textContent = genCost("photo");
  $("edit-go").onclick = async () => {
    const prompt = $("edit-prompt").value.trim();
    if (!photos.length || !prompt) { toast(T.editNeed); haptic("warning"); return; }
    const b = $("edit-go"); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
    try {
      state.gen = (await api("/api/edit", { images: photos, prompt })).gen;
      renderGen(); closeSheet(); haptic("success"); toast(T.sent); setTimeout(() => tg?.close?.(), 900);
    } catch (err) { b.disabled = false; b.textContent = T.editGo; toast(errorText(err)); haptic("error"); }
  };
  draw();
}
function openGenSheet(kind, tpl = null) {
  const ready = kind === "video" ? state.gen.video_ready : state.gen.ready;
  if (!ready) { toast(state.gen.owner ? T.genOwnerSetup : kind === "video" ? T.videoNotReady : T.genNotReady); haptic("warning"); if (state.gen.owner) openGenKeySheet(); return; }
  let fmt = kind === "video" ? "portrait" : "square", seconds = 8, voice = true;
  openSheet(`<div class="head"><div class="big letter" style="background:linear-gradient(135deg,#5b6cff,#d946ef)">${GEN_ICON[kind].replace('class="i"', 'class="i" style="width:46px;height:46px;stroke:#fff"')}</div>
      <h3>${tpl ? esc(tpl.title) : kind === "photo" ? T.makePhoto : T.makeVideo}</h3></div>
    <textarea class="field" id="gen-prompt" maxlength="1200" placeholder="${esc(tpl ? T.describeStyle(tpl.title) : T.describe)}"></textarea>
    <div class="seg" id="gen-fmt" ${kind === "video" ? 'style="grid-template-columns:1fr 1fr"' : ""}>
      ${kind === "photo" ? `<button data-fmt="square">${T.fmtSquare}</button>` : ""}<button data-fmt="portrait">${T.fmtPortrait}</button><button data-fmt="landscape">${T.fmtLandscape}</button>
    </div>
    ${kind === "video" ? `<div class="small" style="margin:0 4px 6px">${T.length}</div>
    <div class="seg" id="gen-len" style="grid-template-columns:repeat(4,1fr)">
      ${[8, 16, 32, 64].map(n => `<button data-len="${n}">${n < 60 ? n + T.sec : "~1" + T.min}</button>`).join("")}
    </div>
    <div class="seg" id="gen-voice" style="grid-template-columns:1fr 1fr">
      <button data-voice="1">🎙 ${T.withVoice}</button><button data-voice="0">${T.noVoice}</button>
    </div>` : ""}
    <div class="cost" id="gen-cost">${genCost(kind, 8)}</div>
    <button class="btn" id="gen-go">${T.create}</button>`);
  const paint = () => {
    $("gen-fmt").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.fmt === fmt));
    $("gen-len")?.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.len === seconds));
    $("gen-voice")?.querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.voice === "1") === voice));
    $("gen-cost").textContent = genCost(kind, seconds) + (kind === "video" && seconds > 8 ? " · " + T.scenes(seconds / 8) : "");
  };
  paint();
  $("gen-fmt").onclick = e => { const b = e.target.closest("[data-fmt]"); if (b) { fmt = b.dataset.fmt; paint(); haptic("select"); } };
  if ($("gen-len")) $("gen-len").onclick = e => { const b = e.target.closest("[data-len]"); if (b) { seconds = +b.dataset.len; paint(); haptic("select"); } };
  if ($("gen-voice")) $("gen-voice").onclick = e => { const b = e.target.closest("[data-voice]"); if (b) { voice = b.dataset.voice === "1"; paint(); haptic("select"); } };
  $("gen-go").onclick = async () => {
    const text = $("gen-prompt").value.trim();
    if (!text) { $("gen-prompt").focus(); haptic("warning"); return; }
    const btn = $("gen-go");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>${T.opening}`;
    try {
      const res = await api("/api/generate", { kind, prompt: tpl ? `${text}, ${tpl.style}` : text, format: fmt, seconds, voice });
      state.gen = res.gen; renderGen();
      closeSheet(); toast(T.genStarted); haptic("success");
    } catch (e) {
      btn.disabled = false; btn.textContent = T.create;
      haptic("error");
      if (e.code === "gen_no_credits") { closeSheet(); setTimeout(openBuySheet, 350); toast(T.noCredits); }
      else toast(errorText(e));
    }
  };
}

/* ---------------- settings ---------------- */

      row("set-mcp", SYM.mcp, T.mcp, state.mcp.length ? String(state.mcp.length) : ""),

  $("set-mem").onclick = () => confirm(T.clearAsk, clearMemory);
  $("set-clear").onclick = () => confirm(T.clearAsk, clearMemory);

async function clearMemory() {
  try { state.settings = (await api("/api/reset")).settings; renderSettings(); toast(T.cleared); haptic("success"); }
  catch (e) { toast(errorText(e)); }

/* ---------------- tabs ---------------- */
const TABS = ["agent", "discover", "codex", "gen", "settings"];  // the apps page has no tab: it opens from the agent tab
function switchTab(tab) {
  if (document.body.dataset.tab === tab) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  haptic("select");
  document.body.dataset.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const lens = $("lens");
  lens.classList.toggle("hidden", TABS.indexOf(tab) < 0);
  if (TABS.indexOf(tab) >= 0) lens.style.setProperty("--tab", TABS.indexOf(tab));
  lens.classList.remove("squish"); void lens.offsetWidth; lens.classList.add("squish");
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  $("model-menu").classList.remove("open");
  window.scrollTo(0, 0);
  paintHeader();
  if (tab === "apps" && !catalog.loaded) loadCatalog(true);
  if (tab === "codex") loadCodex();
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

/* ---------------- Telegram chrome ---------------- */
// Telegram may answer setHeaderColor/setBackgroundColor with a "themeChanged" event. Never react to that
// with a reload or another color call: that was an endless reload loop (the screen kept flashing).
const painted = {};
function tgColor(method, color, version) {
  if (!tg?.[method] || !tg.isVersionAtLeast?.(version) || painted[method] === color) return;
  painted[method] = color;
  try { tg[method](color); } catch (e) {}
}
const bgColor = () => getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
function paintHeader() {
  tgColor("setHeaderColor", bgColor(), "6.1");
}
function applyTheme() {
  const scheme = tg?.colorScheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const theme = scheme === "light" ? "light" : "dark";
  if (document.documentElement.dataset.theme === theme) return false;
  document.documentElement.dataset.theme = theme;
  return true;
}
function paintChrome() {
  tgColor("setBackgroundColor", bgColor(), "6.1");
  tgColor("setBottomBarColor", bgColor(), "7.10");
  paintHeader();
}
window.addEventListener("scroll", paintHeader, { passive: true });

function hideSplash() {
  const el = $("splash");
  if (!el || el.classList.contains("gone")) return;
  // Keep it at least a moment so the app doesn't flash in.
  const wait = Math.max(0, 3000 - performance.now());
  setTimeout(() => { el.classList.add("gone"); setTimeout(() => el.remove(), 600); }, wait);
}
function init() {
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";  // always open at the top
  applyTheme();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  $("hero-logo").innerHTML = logoSvg("hero");
  $("footer-logo").innerHTML = logoSvg("foot");
  $("hello").textContent = T.hello(tg?.initDataUnsafe?.user?.first_name);
  renderQuick();
  renderDiscover();
  renderCatalog(true);
  $("home-apps").innerHTML = Array.from({ length: 4 }, () => `<div class="row skeleton"><div class="ic"></div><div class="body"><div class="bar" style="width:35%"></div><div class="bar" style="width:70%"></div></div></div>`).join("");
  $("model-name").textContent = "…";
  $("cta-text").textContent = T.ctaNone;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.isVersionAtLeast?.("7.7") && tg.disableVerticalSwipes(); } catch (e) {}
    // Only a real light/dark switch changes anything; echoes of our own color calls are ignored.
    tg.onEvent?.("themeChanged", () => { if (applyTheme()) paintChrome(); });
  }
  paintChrome();
  load().then(settle).finally(hideSplash);
  setTimeout(hideSplash, 9000);  // never keep the splash if the server is slow to answer
  // Re-check connections after returning from a sign-in page.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state) load(true); });
}
init();

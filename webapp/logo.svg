<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" class="sai-logo" role="img" aria-label="Secret AI">
  <defs>
    <radialGradient id="sai-orb" cx=".34" cy=".28" r=".95">
      <stop offset="0" stop-color="#2b2457"/>
      <stop offset=".55" stop-color="#121024"/>
      <stop offset="1" stop-color="#06060c"/>
    </radialGradient>
    <linearGradient id="sai-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3a6ff"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <linearGradient id="sai-star" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e3deff"/>
      <stop offset="1" stop-color="#8d7bff"/>
    </linearGradient>
    <radialGradient id="sai-glow">
      <stop offset="0" stop-color="#9f90ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#6d5dfc" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sai-logo .sai-spark { animation: sai-pulse 4.5s ease-in-out infinite; transform-origin: 64px 64px; }
    .sai-logo .sai-sheen { animation: sai-spin 9s linear infinite; transform-origin: 64px 64px; }
    .sai-logo .sai-glow { animation: sai-breathe 4.5s ease-in-out infinite; transform-origin: 64px 64px; }
    .sai-logo .sai-mini { animation: sai-twinkle 3.2s ease-in-out infinite; transform-origin: 94px 34px; }
    @keyframes sai-pulse { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.05) rotate(8deg); } }
    @keyframes sai-spin { to { transform: rotate(360deg); } }
    @keyframes sai-breathe { 50% { transform: scale(1.15); opacity: .7; } }
    @keyframes sai-twinkle { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sai-logo * { animation: none !important; } }
  </style>
  <circle cx="64" cy="64" r="60" fill="url(#sai-orb)"/>
  <circle class="sai-sheen" cx="64" cy="64" r="59.2" fill="none" stroke="url(#sai-ring)" stroke-width="1.6"/>
  <circle class="sai-glow" cx="64" cy="64" r="40" fill="url(#sai-glow)"/>
  <path class="sai-spark" fill="url(#sai-star)" d="M64 24C66.4 50.4 77.6 61.6 104 64 77.6 66.4 66.4 77.6 64 104 61.6 77.6 50.4 66.4 24 64 50.4 61.6 61.6 50.4 64 24Z"/>
  <path class="sai-mini" fill="#ffffff" d="M94 26C94.6 32.6 95.4 33.4 102 34 95.4 34.6 94.6 35.4 94 42 93.4 35.4 92.6 34.6 86 34 92.6 33.4 93.4 32.6 94 26Z"/>
</svg>
